name: Build IPA

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcrun -sdk iphoneos -show-sdk-path
          swift --version

      - name: Core tests
        working-directory: ShotClean/Packages/ShotCleanCore
        run: swift test

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Build unsigned IPA
        working-directory: ShotClean
        run: |
          xtool dev build --ipa
          ls -la xtool

      - uses: actions/upload-artifact@v4
        with:
          name: ShotClean-ipa
          path: ShotClean/xtool/*.ipa
          if-no-files-found: error
